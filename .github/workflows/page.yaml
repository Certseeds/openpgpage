name: github pages

on:
  push:
    branches: [ "master" ]

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: certseeds/common-actions/actions/checkout@v1

      - uses: certseeds/common-actions/actions/setup-nodejs@v1

      - name: download avatars
        run: curl -f "https://avatars.githubusercontent.com/u/51754303?s=40" -o ./public/favicon.ico

      - name: node prepare
        run: pnpm i

      - name: node test
        run: pnpm run test

      - name: node build
        run: pnpm run build

      - name: Upload artifact
        uses: certseeds/common-actions/actions/upload-pages-artifact@v1
        with:
          path: ./dist

  # Deployment job
  deploy:
    # Add a dependency to the build job
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: certseeds/common-actions/actions/deploy-pages@v1
